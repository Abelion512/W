<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <style>
    /* Borderless, iOS-grouped surface: depth comes from layered fills and a
       single soft highlight, never from outlined boxes. */
    :root {
      --bg: #0b0b0d;
      --surface: #16161a;
      --surface-2: #202027;
      --surface-3: #2a2a33;
      --text: #f5f5f7;
      --muted: #9a9aa2;
      --muted-2: #85858d;
      --hairline: rgba(255, 255, 255, 0.07);
      --accent: #7c8cff;
      --ok: #30d158;
      --warn: #ff9f0a;
      --bad: #ff453a;
      --r-lg: 18px;
      --r-md: 13px;
      --r-sm: 10px;
      --wrap-top: #141418;
      --accent-glow: rgba(124, 140, 255, 0.10);
      --accent-soft-bg: rgba(124, 140, 255, 0.16);
      --accent-soft-bg-hover: rgba(124, 140, 255, 0.22);
      --accent-soft-text: #c7cdff;
      --code-bg: rgba(255, 255, 255, 0.06);
      --highlight: rgba(255, 255, 255, 0.05);
      --halo-ok: rgba(48, 209, 88, 0.14);
      --halo-warn: rgba(255, 159, 10, 0.14);
      --halo-bad: rgba(255, 69, 58, 0.14);
    }

    /* HIG dark-mode.md: follow the system appearance, never an app switch. */
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f2f3f7;
        --surface: #ffffff;
        --surface-2: #e8ebf2;
        --surface-3: #dce0ea;
        --text: #14213a;
        --muted: #475569;
        --muted-2: #5b6472;
        --hairline: rgba(15, 23, 42, 0.10);
        --accent: #1d4ed8;
        --ok: #047857;
        --warn: #b45309;
        --bad: #b91c1c;
        --wrap-top: #ffffff;
        --accent-glow: rgba(29, 78, 216, 0.08);
        --accent-soft-bg: rgba(29, 78, 216, 0.10);
        --accent-soft-bg-hover: rgba(29, 78, 216, 0.16);
        --accent-soft-text: #1d4ed8;
        --code-bg: rgba(15, 23, 42, 0.06);
        --highlight: rgba(255, 255, 255, 0.7);
        --halo-ok: rgba(4, 120, 87, 0.14);
        --halo-warn: rgba(180, 83, 9, 0.14);
        --halo-bad: rgba(185, 28, 28, 0.14);
      }
    }

    * { box-sizing: border-box; }

    body {
      width: 460px;
      max-width: 100vw;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 16px 16px 18px;
      background:
        radial-gradient(120% 60% at 50% -10%, var(--accent-glow), transparent 70%),
        linear-gradient(180deg, var(--wrap-top) 0%, var(--bg) 46%);
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 2px;
    }
    h1 {
      display: flex;
      align-items: baseline;
      gap: 7px;
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .ver {
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0;
      color: var(--muted-2);
    }
    /* Surfaces */
    .card {
      background: var(--surface);
      border-radius: var(--r-lg);
      padding: 14px 16px;
      box-shadow: inset 0 1px 0 var(--highlight);
    }

    .status {
      display: flex;
      align-items: flex-start;
      gap: 11px;
    }
    .dot {
      flex: none;
      width: 10px;
      height: 10px;
      margin-top: 5px;
      border-radius: 50%;
      background: var(--muted-2);
      transition: background 0.2s, box-shadow 0.2s;
    }
    .dot.ok   { background: var(--ok);   box-shadow: 0 0 0 4px var(--halo-ok); }
    .dot.warn { background: var(--warn); box-shadow: 0 0 0 4px var(--halo-warn); }
    .dot.bad  { background: var(--bad);  box-shadow: 0 0 0 4px var(--halo-bad); }

    .status-text { min-width: 0; flex: 1; }
    #state {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    #tools {
      margin-top: 3px;
      font-size: 12px;
      line-height: 1.45;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    #servers {
      margin-top: 12px;
      padding-top: 11px;
      border-top: 0.5px solid var(--hairline);
      font-size: 12px;
      line-height: 1.7;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.1px;
      color: var(--muted);
      white-space: pre-line;
      overflow-wrap: anywhere;
    }
    #servers:empty { display: none; }

    /* last A2A task: model, effort, tokens, duration */
    #usage {
      margin-top: 12px;
      padding-top: 11px;
      border-top: 0.5px solid var(--hairline);
      font-size: 12px;
      line-height: 1.6;
      letter-spacing: 0.1px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }
    #usage:empty { display: none; }
    #usage .u-label {
      margin-right: 5px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: var(--muted-2);
    }
    #usage .u-model { color: var(--text); font-weight: 600; }
    #usage .u-bad { color: var(--bad); }

    /* Bridge token pairing */
    .pair { display: flex; flex-direction: column; gap: 9px; }
    .pair[hidden] { display: none; }
    .pair label {
      padding: 0 2px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      color: var(--muted-2);
    }
    .pair input {
      width: 100%;
      min-height: 36px;
      padding: 8px 11px;
      border: 0;
      border-radius: var(--r-sm);
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11.5px;
      box-shadow: inset 0 0 0 1px var(--hairline);
      transition: box-shadow 0.15s;
    }
    .pair input:focus-visible {
      outline: none;
      box-shadow: inset 0 0 0 1px rgba(124, 140, 255, 0.7);
    }

    /* Buttons: filled rows, no outlines */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 9px;
    }
    .actions .full { grid-column: 1 / -1; }

    button {
      width: 100%;
      min-height: 40px;
      padding: 9px 12px;
      border: 0;
      border-radius: var(--r-md);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.1px;
      color: var(--text);
      background: var(--surface-2);
      box-shadow: inset 0 1px 0 var(--highlight);
      transition: background 0.15s, transform 0.08s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
      /* Glyphs (↻ ⟳ ⚙) stay monochrome instead of rendering as colour emoji. */
      font-variant-emoji: text;
    }
    button:hover { background: var(--surface-3); }
    button:active { transform: scale(0.985); }
    button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(124, 140, 255, 0.45);
    }
    #reconnect { background: var(--accent-soft-bg); color: var(--accent-soft-text); }
    #reconnect:hover { background: var(--accent-soft-bg-hover); }

    /* Footer */
    .hint {
      margin: 0;
      font-size: 12px;
      line-height: 1.5;
      color: var(--muted-2);
      text-align: center;
    }
    code {
      padding: 1px 6px;
      border-radius: 6px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11.5px;
      color: var(--muted);
      background: var(--code-bg);
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>snapgent <span class="ver" id="ver"></span></h1>
    </header>

    <section class="card">
      <div class="status">
        <span id="dot" class="dot"></span>
        <div class="status-text">
          <div id="state">Bridge: …</div>
          <div id="tools"></div>
        </div>
      </div>
      <div id="usage"></div>
      <div id="servers"></div>
    </section>

    <section class="card pair" id="pair" hidden>
      <label for="token">Bridge token</label>
      <input id="token" type="password" autocomplete="off" spellcheck="false"
             placeholder="Paste the token printed by the bridge" />
      <button id="save-token">Save token</button>
      <p class="hint">Shown in the bridge window on first run, or in <code>~/.snapgent/bridge_token</code>.</p>
    </section>

    <div class="actions">
      <button id="reconnect" title="Redial the bridge (does not restart it)">↻ Reconnect</button>
      <button id="restart" title="Restart the MCP servers only - the bridge keeps running">⟳ Restart</button>
      <button id="settings">⚙ Settings…</button>
      <button class="full" id="rotate-token" hidden>Rotate token</button>
      <button class="full" id="forget-token" hidden>Forget saved token</button>
    </div>

    <p class="hint" id="launch-hint">
      Start with <code>start.bat</code>.
    </p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
