# Path rules for .github/workflows/labeler.yml. The key is the label to apply;
# every changed file is matched against the globs below.
# Labels not listed here (bug, enhancement, question, ...) stay manual.

bridge:
  - changed-files:
      - any-glob-to-any-file:
          - bridge.py
          - bridge_auth.py
          - workspace_mcp.py
          - requirements.txt
          - vscode_mcp.py
          - Linux_Start.sh
          - MacOS_Start.command
          - start.bat
          - start-*.ps1
          - setup-config.py
          - setup-config.ps1
          - "*.spec"

extension:
  - changed-files:
      - any-glob-to-any-file: snapgent-extension/**

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"
          - docs/**
          - LICENSE

security:
  # the handshake itself: origin allowlist, token check, token file, revocation
  # plus workspace containment (path resolution, run_command policy)
  - changed-files:
      - any-glob-to-any-file:
          - bridge_auth.py
          - bridge.py
          - workspace_mcp.py

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - pyproject.toml
          - .editorconfig
          - "*.spec"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - tests/**
          - e2e/**
          - snapgent-extension/test-*.js

model-catalog:
  - changed-files:
      - any-glob-to-any-file:
          - docs/model-catalog*.md
          - docs/model-catalog.json
          - scripts/refresh-model-catalog.py
          - scripts/install-model-catalog-timer.sh

versioning:
  - changed-files:
      - any-glob-to-any-file:
          - VERSION
          - scripts/version-sync.py
          - CHANGELOG.md
