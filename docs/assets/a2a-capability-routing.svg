<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360">
  <rect width="920" height="360" fill="#0f1117"/>
  <text x="40" y="52" fill="#facc15" font-family="monospace" font-size="24" font-weight="bold">A2A routing: capability aware</text>
  <text x="40" y="82" fill="#9ca3af" font-family="monospace" font-size="13">Same precedence. Extra filters before a tab is chosen.</text>

  <rect x="40" y="110" width="380" height="200" rx="10" fill="#1b1f2a" stroke="#374151"/>
  <text x="64" y="142" fill="#ef4444" font-family="monospace" font-size="17" font-weight="bold">BEFORE</text>
  <text x="64" y="176" fill="#d1d5db" font-family="monospace" font-size="14">metadata -&gt; tier/category/complexity</text>
  <text x="64" y="204" fill="#d1d5db" font-family="monospace" font-size="14">-&gt; first open tab in the chain</text>
  <text x="64" y="240" fill="#f87171" font-family="monospace" font-size="13">vision / web / size ignored</text>
  <text x="64" y="266" fill="#f87171" font-family="monospace" font-size="13">blocked provider still selected</text>

  <rect x="500" y="110" width="380" height="200" rx="10" fill="#1b1f2a" stroke="#facc15"/>
  <text x="524" y="142" fill="#facc15" font-family="monospace" font-size="17" font-weight="bold">AFTER</text>
  <text x="524" y="176" fill="#d1d5db" font-family="monospace" font-size="14">same base chain</text>
  <text x="524" y="204" fill="#d1d5db" font-family="monospace" font-size="14">-&gt; needsVision / needsWeb / largeInput</text>
  <text x="524" y="230" fill="#d1d5db" font-family="monospace" font-size="14">-&gt; avoidProviders -&gt; first open tab</text>
  <text x="524" y="266" fill="#4ade80" font-family="monospace" font-size="13">empty filter -&gt; capabilityFallback</text>

  <text x="40" y="340" fill="#6b7280" font-family="monospace" font-size="12">Generated by scripts/make_a2a_capability_infographic.py</text>
