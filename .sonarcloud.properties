# snapgent-app/extension mirrors snapgent-extension for the Electron desktop
# build. Both trees must stay in sync, so CPD would flag the mirror as copied
# code. Exclude only the mirrored files; issue analysis stays enabled.
# Autoscan does not allow wildcard patterns, so list each file explicitly.
sonar.cpd.exclusions=snapgent-app/extension/background.js,snapgent-app/extension/core/main.js,snapgent-app/extension/providers/arena.js,snapgent-app/extension/providers/deepseek.js,snapgent-app/extension/providers/gemini.js,snapgent-extension/background.js,snapgent-extension/core/main.js,snapgent-extension/providers/arena.js,snapgent-extension/providers/deepseek.js,snapgent-extension/providers/gemini.js
